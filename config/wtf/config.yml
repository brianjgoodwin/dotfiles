---
wtf:
  colors:
    background: black
    border:
      focusable: darkslateblue
      focused: orange
      normal: gray
    checked: yellow
    highlight:
      fore: black
      back: gray
    rows:
      even: yellow
      odd: white
  grid:
    columns:
      - 35
      - 35
      - 35
      - 35
    rows:
      - 10
      - 10
      - 10
      - 10
      - 4
  refreshInterval: 1
  openFileUtil: open
  mods:
    europe_time:
      title: Europe
      type: clocks
      colors:
        rows:
          even: lightblue
          odd: white
      enabled: true
      locations:
        GMT: Etc/GMT
        Amsterdam: Europe/Amsterdam
        Berlin: Europe/Berlin
        Barcelona: Europe/Madrid
        Copenhagen: Europe/Copenhagen
        London: Europe/London
        Rome: Europe/Rome
        Stockholm: Europe/Stockholm
      position:
        top: 0
        left: 0
        height: 1
        width: 1
      refreshInterval: 15
      sort: alphabetical
    americas_time:
      title: Americas
      type: clocks
      colors:
        rows:
          even: lightblue
          odd: white
      enabled: true
      locations:
        UTC: Etc/UTC
        Vancouver: America/Vancouver
        New_York: America/New_York
        Sao_Paulo: America/Sao_Paulo
        Denver: America/Denver
        Iqaluit: America/Iqaluit
        Bahamas: America/Nassau
        Chicago: America/Chicago
      position:
        top: 0
        left: 1
        height: 1
        width: 1
      refreshInterval: 15
      sort: alphabetical
    battery:
      type: power
      title: ⚡️
      enabled: true
      position:
        top: 1
        left: 3
        height: 1
        width: 1
      refreshInterval: 15
    weather_seattle:
      type: weather
      title: Seattle, WA
      apiKey: "1be427e449fe511f2de8a1977b28b3dc"
      cityids:
        - 5809844
      colors:
        current: lightblue
      enabled: true
      language: EN
      position:
        top: 0
        left: 2
        height: 1
        width: 1
      refreshInterval: 900
      tempUnit: F
      useEmoji: true
    weather_portland:
      type: weather
      title: Portland, ME
      apiKey: "1be427e449fe511f2de8a1977b28b3dc"
      cityids:
        - 4975802
      colors:
        current: lightblue
      enabled: true
      language: EN
      position:
        top: 0
        left: 3
        height: 1
        width: 1
      refreshInterval: 900
      tempUnit: F
      useEmoji: true
    ip:
      type: ipinfo
      title: My IP
      colors:
        name: lightblue
        value: white
      enabled: true
      position:
        top: 1
        left: 0
        height: 1
        width: 2
      refreshInterval: 150
    security_info:
      type: security
      title: Staying safe
      enabled: true
      position:
        top: 1
        left: 2
        height: 1
        width: 1
      refreshInterval: 3600
    yfinance:
      type: yfinance
      enabled: true
      title: Stock and exchange rate
      sort: true
      refreshInterval: 10m
      symbols:
        - ".DJI"
        - "NDAQ"
        - "^GSPC"
        - ".FTSE"
        - ".N225"
        - "AAPL"
        - "VOO"
      position:
        top: 2
        left: 0
        height: 1
        width: 1
    feedreader:
      type: feedreader
      title: RSS Feeds
      enabled: true
      feeds:
        - https://brianjgoodwin.net/feed.xml
        - https://daringfireball.net/feeds/json
      position:
        top: 2
        left: 1
        height: 1
        width: 3
      refreshInterval: 900
    resources:
      type: resourceusage
      enabled: true
      position:
        top: 3
        left: 0
        height: 2
        width: 1
      refreshInterval: 1
    uptime:
      type: cmdrunner
      args: []
      cmd: uptime
      enabled: true
      position:
        top: 4
        left: 1
        height: 1
        width: 3
      refreshInterval: 30
    disks:
      type: cmdrunner
      cmd: df
      args:
        - -h
      enabled: true
      position:
        top: 3
        left: 1
        height: 1
        width: 3
      refreshInterval: 3600
